  occupation: String
  policies: [Policy!]!
  namedInsureds: [NamedInsured!]!
  driveEasy: DriveEasy
  agentId: ID
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""A person named on the policy who may also be a driver or co-owner."""
type NamedInsured {
  id: ID!
  firstName: String!
  lastName: String!
  relationship: String!
  dateOfBirth: Date!
  gender: Gender
  licenseNumber: String
  licenseState: String
  licenseStatus: LicenseStatus
  yearsLicensed: Int
  mvrRecords: [MVRRecord!]!
  accidentRecords: [AccidentRecord!]!
  violationRecords: [ViolationRecord!]!
}

"""A secondary driver added to an auto policy."""
type AdditionalDriver {
  id: ID!
