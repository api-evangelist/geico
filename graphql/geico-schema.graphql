"""
GEICO Insurance - Conceptual GraphQL Schema
Covers auto, home, renters, motorcycle, boat, life, and business insurance
product lines as offered by GEICO (a Berkshire Hathaway subsidiary).
This schema is derived from public product documentation and does not
represent an officially published GEICO API.
"""

# ─────────────────────────────────────────────
# Scalars
# ─────────────────────────────────────────────

scalar Date
scalar DateTime
scalar Decimal
scalar JSON

# ─────────────────────────────────────────────
# Enums
# ─────────────────────────────────────────────

enum PolicyType {
  AUTO
  HOME
  RENTERS
  MOTORCYCLE
  BOAT
  LIFE
  BUSINESS
}

enum PolicyStatus {
  ACTIVE
  PENDING
  CANCELLED
  EXPIRED
  SUSPENDED
}

enum ClaimStatusCode {
  REPORTED
  UNDER_REVIEW
  INSPECTION_SCHEDULED
  ESTIMATE_PREPARED
  APPROVED
  IN_REPAIR
  PAYMENT_ISSUED
  CLOSED
  DENIED
}

enum CoverageType {
  BODILY_INJURY
  PROPERTY_DAMAGE
  COLLISION
  COMPREHENSIVE
  UNINSURED_MOTORIST
  UNDERINSURED_MOTORIST
  PERSONAL_INJURY_PROTECTION
  MEDICAL_PAYMENTS
  RENTAL_REIMBURSEMENT
  ROADSIDE_ASSISTANCE
  GAP
}

enum VehicleUse {
  PLEASURE
  COMMUTE
  BUSINESS
  FARM
}

enum DiscountType {
  MILITARY
  FEDERAL_EMPLOYEE
  GOOD_DRIVER
  MULTI_POLICY
  MULTI_VEHICLE
  MATURE_DRIVER
  NEW_VEHICLE
  GOOD_STUDENT
  DAYTIME_RUNNING_LIGHTS
  ANTI_THEFT
  ANTI_LOCK_BRAKES
  AIRBAGS
  EMERGENCY_DEPLOYMENT
  DRIVE_EASY
  SEAT_BELT
  DEFENSIVE_DRIVING
}

enum PaymentFrequency {
  ANNUAL
  SEMI_ANNUAL
  QUARTERLY
  MONTHLY
}

enum PropertyType {
  SINGLE_FAMILY
  CONDO
  TOWNHOUSE
  MOBILE_HOME
  MULTI_FAMILY
  RENTAL
}

enum BoatType {
  MOTORBOAT
  SAILBOAT
  PERSONAL_WATERCRAFT
  PONTOON
  HOUSEBOAT
  YACHT
}

enum LifePolicyType {
  TERM
  WHOLE
  UNIVERSAL
}

enum Gender {
  MALE
  FEMALE
  NON_BINARY
  UNSPECIFIED
}

enum MaritalStatus {
  SINGLE
  MARRIED
  DIVORCED
  WIDOWED
}

enum LicenseStatus {
  VALID
  SUSPENDED
  REVOKED
  EXPIRED
  INTERNATIONAL
}

# ─────────────────────────────────────────────
# Interfaces
# ─────────────────────────────────────────────

"""Base interface for all GEICO insurance policy types."""
interface Policy {
  id: ID!
  policyNumber: String!
  type: PolicyType!
  status: PolicyStatus!
  effectiveDate: Date!
  expirationDate: Date!
  policyHolder: PolicyHolder!
  premium: Premium!
  discounts: [GeicoDiscount!]!
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""Base interface for all GEICO discount types."""
interface GeicoDiscount {
  id: ID!
  type: DiscountType!
  description: String!
  amount: Decimal!
  percentage: Decimal
  appliedAt: DateTime!
  eligibilityCriteria: String
}

# ─────────────────────────────────────────────
# Policy Holder & Named Insured
# ─────────────────────────────────────────────

