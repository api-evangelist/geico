# ─────────────────────────────────────────────
# Root Operations
# ─────────────────────────────────────────────

type Query {
  """Fetch a single policy by ID. Returns any policy subtype."""
  policy(id: ID!): Policy

  """List all policies for a given policyholder."""
  policies(holderId: ID!): [Policy!]!

  """Fetch a policyholder by ID."""
  policyHolder(id: ID!): PolicyHolder

  """Look up a vehicle by its VIN number."""
  vehicle(vin: String!): Vehicle

  """Request a real-time rate quote for new coverage."""
  rateQuote(input: RateQuoteInput!): RateQuote

  """Fetch a single claim by ID."""
  claim(id: ID!): Claim

  """List all claims associated with a policy."""
  claims(policyId: ID!): [Claim!]!

  """List discounts applied to a specific policy."""
  discounts(policyId: ID!): [GeicoDiscount!]!

  """Fetch the current DriveEasy score for a policyholder."""
  driveScore(holderId: ID!): DriveScore

  """Fetch DriveEasy trip history for a DriveEasy enrollment."""
  driveEasyTrips(driveEasyId: ID!, limit: Int, offset: Int): [DriveEasyTrip!]!

  """Fetch a single agent by ID."""
  agent(id: ID!): Agent

  """Find local GEICO agents by ZIP code."""
  agentLocator(zip: String!, radius: Int): AgentLocator

  """Decode a VIN into year, make, model, and feature details."""
  decodeVin(vin: String!): VIN

  """List available auto makes for a given model year."""
  autoMakes(year: Int!): [AutoMake!]!

  """List available models for a given make and year."""
  autoModels(makeId: ID!, year: Int!): [AutoModel!]!

  """Fetch repair shops near a ZIP code, optionally filtered by certification."""
  repairShops(zip: String!, radius: Int, certifiedOnly: Boolean): [RepairShop!]!
}

type Mutation {
  """Initiate a new rate quote for a prospective customer."""
  createQuote(input: RateQuoteInput!): RateQuote!

  """Convert an accepted rate quote into a bound policy."""
  bindPolicy(quoteId: ID!): Policy!

  """Add a vehicle to an existing auto or motorcycle policy."""
  addVehicle(policyId: ID!, vehicle: VehicleInput!): Vehicle!

  """Remove a vehicle from a policy."""
  removeVehicle(policyId: ID!, vehicleId: ID!): Boolean!

  """Add a named insured or additional driver to a policy."""
  addDriver(policyId: ID!, driver: DriverInput!): AdditionalDriver!

  """Update coverage selections on an existing policy."""
  updateCoverage(policyId: ID!, coverage: CoverageInput!): Coverage!

  """File a new claim against a policy."""
  fileClaim(policyId: ID!, input: ClaimInput!): Claim!

  """Update an existing claim with new information."""
  updateClaim(claimId: ID!, input: ClaimUpdateInput!): Claim!

  """Enroll a policy in the DriveEasy telematics program."""
  enrollDriveEasy(policyId: ID!): DriveEasy!

  """Apply a qualifying discount to a policy."""
  applyDiscount(policyId: ID!, discount: DiscountInput!): GeicoDiscount!

  """Exchange a partner API key for a short-lived session token."""
  issueToken(apiKey: String!): Token!

  """Cancel an active policy."""
  cancelPolicy(policyId: ID!, reason: String!): Policy!

  """Renew an expiring policy."""
  renewPolicy(policyId: ID!): Policy!
}
